<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrightPath Admin</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #17233b;
      background: #f4f7fc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      padding: 20px 5%;
      background: #fff;
      border-bottom: 1px solid #dfe5ef;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    main { max-width: 1100px; margin: 30px auto; padding: 0 18px; }
    .card {
      background: #fff;
      border: 1px solid #e1e7f0;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px #17233b0b;
    }
    .login-card { max-width: 440px; margin: 70px auto; }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd4e1;
      border-radius: 9px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: #4169e1;
      color: white;
    }
    button.secondary { background: #e9eef8; color: #17233b; }
    button.danger { background: #a93232; }
    .password-row { display: flex; gap: 8px; }
    .password-row input { flex: 1; min-width: 0; }
    .password-row button { flex: 0 0 auto; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 16px; }
    .note { color: #65738a; font-size: 14px; }
    .error { color: #a93232; min-height: 20px; }
    .success { color: #167044; min-height: 20px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e5eaf1; }
    th { color: #65738a; font-size: 13px; }
    td button { padding: 7px 10px; margin-right: 5px; }
    [hidden] { display: none !important; }
    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 16px; }
      .card { padding: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>BrightPath Learning</h1>
      <div class="note">Teacher admin dashboard</div>
    </div>
    <button id="signOutBtn" class="secondary" hidden>Sign out</button>
  </header>

  <main>
    <section id="loginCard" class="card login-card">
      <h2>Teacher sign in</h2>
      <p class="note">Sign in with the teacher account created in Firebase Authentication.</p>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>

        <label for="loginPassword">Password</label>
        <div class="password-row">
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button id="togglePassword" class="secondary" type="button" aria-pressed="false">Show</button>
        </div>

        <div class="actions"><button type="submit">Sign in</button></div>
        <p id="loginMessage" class="error" role="status"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="card">
        <h2>Student record</h2>
        <p class="note">Add a record or select Edit in the list to update one.</p>
        <form id="studentForm">
          <div class="grid">
            <div>
              <label for="studentName">Student name</label>
              <input id="studentName" required>
            </div>
            <div>
              <label for="studentEmail">Student email</label>
              <input id="studentEmail" type="email" required>
            </div>
            <div>
              <label for="membership">Membership</label>
              <select id="membership">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div>
              <label for="modulesCompleted">Modules completed (out of 4)</label>
              <input id="modulesCompleted" type="number" min="0" max="4" value="0" required>
            </div>
            <div>
              <label for="quizScore">Latest quiz score (%)</label>
              <input id="quizScore" type="number" min="0" max="100" placeholder="Leave blank if none">
            </div>
          </div>

          <label for="weeklyNotes">Weekly assessment notes</label>
          <textarea id="weeklyNotes" placeholder="Record areas where the student may need support"></textarea>

          <div class="actions">
            <button type="submit">Save student record</button>
            <button id="clearBtn" type="button" class="secondary">Clear</button>
            <button id="refreshBtn" type="button" class="secondary">Refresh list</button>
          </div>
          <p id="formMessage" role="status"></p>
        </form>
      </div>

      <div class="card">
        <h2>Students</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th><th>Email</th><th>Membership</th>
                <th>Modules</th><th>Quiz</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentsTable"></tbody>
          </table>
        </div>
        <p id="listMessage" class="note"></p>
      </div>
    </section>
  </main>

  <script type="module">
    import { firebaseConfig, teacherEmail } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
      setPersistence, inMemoryPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, getDocs, doc, setDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const loginMessage = document.getElementById("loginMessage");
    const formMessage = document.getElementById("formMessage");
    const listMessage = document.getElementById("listMessage");
    const studentsTable = document.getElementById("studentsTable");
    const signOutBtn = document.getElementById("signOutBtn");
    const studentForm = document.getElementById("studentForm");
    const passwordInput = document.getElementById("loginPassword");
    const togglePassword = document.getElementById("togglePassword");

    let editingId = null;
    let records = [];

    togglePassword.addEventListener("click", () => {
      const showPassword = passwordInput.type === "password";
      passwordInput.type = showPassword ? "text" : "password";
      togglePassword.textContent = showPassword ? "Hide" : "Show";
      togglePassword.setAttribute("aria-pressed", String(showPassword));
    });

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function clearForm() {
      studentForm.reset();
      document.getElementById("modulesCompleted").value = "0";
      document.getElementById("studentEmail").readOnly = false;
      editingId = null;
      formMessage.textContent = "";
    }

    async function loadStudents() {
      listMessage.textContent = "Loading student records…";
      studentsTable.innerHTML = "";
      try {
        const result = await getDocs(collection(db, "students"));
        records = result.docs.map(item => ({ id: item.id, ...item.data() }));
        records.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        listMessage.textContent = records.length
          ? `${records.length} student record(s).`
          : "No student records yet.";

        studentsTable.innerHTML = records.map(student => `
          <tr>
            <td>${escapeHtml(student.name)}</td>
            <td>${escapeHtml(student.email)}</td>
            <td>${escapeHtml(student.membership || "Active")}</td>
            <td>${Number(student.modulesCompleted || 0)} / 4</td>
            <td>${student.quizScore === "" || student.quizScore == null
              ? "—" : `${Number(student.quizScore)}%`}</td>
            <td>
              <button type="button" data-edit="${escapeHtml(student.id)}">Edit</button>
              <button type="button" class="danger" data-delete="${escapeHtml(student.id)}">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (error) {
        listMessage.textContent = `Could not load records: ${error.message}`;
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      loginMessage.textContent = "Signing in…";
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("loginEmail").value.trim(),
          passwordInput.value
        );
      } catch (error) {
        loginMessage.textContent = `Sign-in failed: ${error.message}`;
      }
    });

    signOutBtn.addEventListener("click", () => signOut(auth));
    document.getElementById("refreshBtn").addEventListener("click", loadStudents);
    document.getElementById("clearBtn").addEventListener("click", clearForm);

    studentForm.addEventListener("submit", async event => {
      event.preventDefault();
      formMessage.className = "note";
      formMessage.textContent = "Saving…";

      const email = document.getElementById("studentEmail").value.trim().toLowerCase();
      const modulesCompleted = Number(document.getElementById("modulesCompleted").value);
      const scoreText = document.getElementById("quizScore").value.trim();

      const record = {
        name: document.getElementById("studentName").value.trim(),
        email,
        membership: document.getElementById("membership").value,
        modulesCompleted,
        quizScore: scoreText === "" ? "" : Number(scoreText),
        weeklyNotes: document.getElementById("weeklyNotes").value.trim(),
        updatedAt: serverTimestamp()
      };

      try {
        const recordId = editingId || email;
        await setDoc(doc(db, "students", recordId), record, { merge: true });
        formMessage.className = "success";
        formMessage.textContent = "Student record saved.";
        clearForm();
        await loadStudents();
      } catch (error) {
        formMessage.className = "error";
        formMessage.textContent = `Could not save: ${error.message}`;
      }
    });

    studentsTable.addEventListener("click", async event => {
      const editId = event.target.dataset.edit;
      const deleteId = event.target.dataset.delete;

      if (editId) {
        const student = records.find(item => item.id === editId);
        if (!student) return;
        editingId = student.id;
        document.getElementById("studentName").value = student.name || "";
        document.getElementById("studentEmail").value = student.email || student.id;
        document.getElementById("studentEmail").readOnly = true;
        document.getElementById("membership").value = student.membership || "Active";
        document.getElementById("modulesCompleted").value = student.modulesCompleted || 0;
        document.getElementById("quizScore").value = student.quizScore ?? "";
        document.getElementById("weeklyNotes").value = student.weeklyNotes || "";
        formMessage.textContent = "Editing this student record.";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      if (deleteId && confirm("Delete this student record?")) {
        try {
          await deleteDoc(doc(db, "students", deleteId));
          await loadStudents();
        } catch (error) {
          listMessage.textContent = `Could not delete: ${error.message}`;
        }
      }
    });

    // Use memory-only sign-in and clear any remembered sign-in on each page load.
    try {
      await setPersistence(auth, inMemoryPersistence);
      await signOut(auth);
    } catch (error) {
      loginMessage.textContent = `Authentication setup error: ${error.message}`;
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        loginCard.hidden = false;
        dashboard.hidden = true;
        signOutBtn.hidden = true;
        return;
      }

      if ((user.email || "").toLowerCase() !== teacherEmail.toLowerCase()) {
        await signOut(auth);
        loginMessage.textContent = "This account is not the teacher account.";
        return;
      }

      loginCard.hidden = true;
      dashboard.hidden = false;
      signOutBtn.hidden = false;
      await loadStudents();
    });
  </script>
</body>
</html>
